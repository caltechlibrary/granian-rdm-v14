      # -*- coding: utf-8 -*-
      #
      # Copyright (C) 2019-2021 CERN.
      # Copyright (C) 2019 Northwestern University.
      # Copyright (C) 2022 Forschungszentrum Jülich GmbH.
      # Copyright (C) 2024-2025 Graz University of Technology.
      #
      # Invenio-Cli is free software; you can redistribute it and/or modify it
      # under the terms of the MIT License; see LICENSE file for more details.

      """Invenio module to ease the creation and management of applications."""

      import os
      from pathlib import Path

      import click

      from ..commands import (
          Commands,
          ContainersCommands,
          LocalCommands,
          RequirementsCommands,
          ServicesCommands,
          UpgradeCommands,
      )
      from ..helpers.cli_config import CLIConfig
      from ..helpers.cookiecutter_wrapper import CookiecutterWrapper
      from .assets import assets
      from .containers import containers
      from .install import install
      from .packages import packages
      from .services import services
      from .translations import translations
      from .utils import (
          combine_decorators,
          handle_process_response,
          pass_cli_config,
          run_steps,
      )


      @click.group()
      @click.version_option()
      @click.pass_context
      def invenio_cli(ctx):
          """Initialize CLI context."""


      invenio_cli.add_command(assets)
      invenio_cli.add_command(containers)
      invenio_cli.add_command(install)
      invenio_cli.add_command(packages)
      invenio_cli.add_command(services)
      invenio_cli.add_command(translations)


      @invenio_cli.command("check-requirements")
      @click.option(
          "--development",
          "-d",
          default=False,
          is_flag=True,
          help="Check requirements for a local development installation.",
      )
      def check_requirements(development):
          """Checks the system fulfills the pre-requirements."""
          click.secho("Checking pre-requirements...", fg="green")
          steps = RequirementsCommands.check(development)
          on_fail = "Pre requisites not met."
          on_success = "All requisites are fulfilled."

          run_steps(steps, on_fail, on_success)


      @invenio_cli.command()
      @pass_cli_config
      def shell(cli_config):
          """Shell command."""
          Commands(cli_config).shell()


      @invenio_cli.command()
      @click.option(
          "--debug/--no-debug",
          "-d/",
          default=False,
          is_flag=True,
          help="Enable Flask development mode (default: disabled).",
      )
      @pass_cli_config
      def pyshell(cli_config, debug):
          """Python shell command."""
          Commands(cli_config).pyshell(debug=debug)


      @invenio_cli.command()
      @click.argument(
          "flavour",
          type=click.Choice(["RDM", "ILS"], case_sensitive=False),
          default="RDM",
          required=False,
      )
      @click.option(
          "-t", "--template", required=False, help="Cookiecutter path or git url to template"
      )
      @click.option(
          "-c",
          "--checkout",
          required=False,
          help="Branch, tag or commit to checkout if --template is a git url",
      )  # noqa
      @click.option(
          "--user-input/--no-input",
          default=True,
          help="If input is disabled, uses the defaults (if --config is also passed, uses values from an .invenio config file).",  # noqa
      )
      @click.option(
          "--config", required=False, help="The .invenio configuration file to use."
      )
      def init(flavour, template, checkout, user_input, config):
          """Initializes the application according to the chosen flavour."""
          click.secho(
              "Initializing {flavour} application...".format(flavour=flavour), fg="green"
          )

          cookiecutter_kwargs = {
              "template": template,
              "checkout": checkout,
              "no_input": not user_input,
              "config": config,
          }
          cookiecutter_wrapper = CookiecutterWrapper(flavour, **cookiecutter_kwargs)

          try:
              click.secho("Running cookiecutter...", fg="green")
              project_dir = cookiecutter_wrapper.cookiecutter()

              click.secho("Writing invenio-cli config files...", fg="green")
              saved_replay = cookiecutter_wrapper.get_replay()
              CLIConfig.write(project_dir, flavour, saved_replay)

              click.secho("Creating logs directory...", fg="green")
              os.mkdir(Path(project_dir) / "logs")

          except Exception as e:
              click.secho(str(e), fg="red")

          finally:
              cookiecutter_wrapper.remove_config()


      web_options = combine_decorators(
          click.option(
              "--host",
              "-h",
              default=None,
              help="The interface to bind to. The default is defined in the CLIConfig.",
          ),
          click.option(
              "--port",
              "-p",
              default=None,
              help="The port to bind to. The default is defined in the CLIConfig.",
          ),
          click.option(
              "--debug/--no-debug",
              "-d/",
              default=True,
              is_flag=True,
              help="Enable/disable debug mode including auto-reloading (default: enabled).",
          ),
          click.option(
              "--runner",
              type=click.Choice(["flask", "granian"], case_sensitive=False),
              default="flask",
              help=(
                  "Dev web server to run: the stock Flask dev server (default) or "
                  "Granian, matching this project's production runtime."
              ),
          ),
      )


      services_option = click.option(
          "--services/--no-services",
          "-s/-n",
          default=True,
          is_flag=True,
          help="Enable/disable dockerized services (default: enabled).",
      )


      worker_options = combine_decorators(
          click.option(
              "--celery-log-file",
              default=None,
              help="Celery log file (default: None, this means logging to stderr)",
          ),
          click.option(
              "--celery-log-level",
              default="INFO",
              help="Celery log level (default: INFO)",
          ),
          click.option(
              "--jobs-scheduler/--no-jobs-scheduler",
              default=True,
              help="Enable/disable separate jobs scheduler (default: enabled)",
          ),
      )


      @invenio_cli.group("run", invoke_without_command=True)
      @web_options  # this and below for backwards-compatibility
      @services_option
      @worker_options
      @pass_cli_config
      @click.pass_context
      def run_group(ctx, *args, **kwargs):
          """Run command group."""
          # For backward compatibility
          if ctx.invoked_subcommand is None:
              ctx.forward(run_all)


      @run_group.command("web")
      @services_option
      @web_options
      @pass_cli_config
      def run_web(cli_config, host, port, debug, services, runner):
          """Starts the local development web server."""
          if services:
              cmds = ServicesCommands(cli_config)
              response = cmds.ensure_containers_running()
              # fail and exit if containers are not running
              handle_process_response(response)

          host = host or cli_config.get_web_host()
          port = port or cli_config.get_web_port()

          commands = LocalCommands(cli_config)
          processes = commands.run_web(
              host=host, port=str(port), debug=debug, runner=runner
          )
          for proc in processes:
              proc.wait()


      @run_group.command("worker")
      @services_option
      @worker_options
      @pass_cli_config
      def run_worker(cli_config, services, celery_log_file, celery_log_level, jobs_scheduler):
          """Starts the local development server."""
          if services:
              cmds = ServicesCommands(cli_config)
              response = cmds.ensure_containers_running()
              # fail and exit if containers are not running
              handle_process_response(response)

          commands = LocalCommands(cli_config)
          processes = commands.run_worker(
              celery_log_file=celery_log_file,
              celery_log_level=celery_log_level,
              jobs_scheduler=jobs_scheduler,
          )
          for proc in processes:
              proc.wait()


      @run_group.command("all")
      @services_option
      @web_options
      @worker_options
      @pass_cli_config
      def run_all(
          cli_config,
          host,
          port,
          debug,
          services,
          celery_log_file,
          celery_log_level,
          jobs_scheduler,
          runner,
      ):
          """Starts web and worker development servers."""
          if services:
              cmds = ServicesCommands(cli_config)
              response = cmds.ensure_containers_running()
              # fail and exit if containers are not running
              handle_process_response(response)

          host = host or cli_config.get_web_host()
          port = port or cli_config.get_web_port()

          commands = LocalCommands(cli_config)
          processes = commands.run_all(
              host=host,
              port=str(port),
              debug=debug,
              services=services,
              celery_log_file=celery_log_file,
              celery_log_level=celery_log_level,
              jobs_scheduler=jobs_scheduler,
              runner=runner,
          )
          for proc in processes:
              proc.wait()


      @invenio_cli.command()
      @pass_cli_config
      def destroy(cli_config):
          """Removes all associated resources (containers, images, volumes)."""
          commands = Commands(cli_config)
          services = ContainersCommands(cli_config)
          click.secho("Destroying containers, volumes, virtual environment...", fg="green")
          steps = commands.destroy()  # Destroy virtual environment
          steps.extend(services.destroy())  # Destroy services
          on_fail = (
              "Failed to destroy instance. You can destroy only services "
              + "using the services command: invenio-cli services destroy"
          )
          on_success = "Instance destroyed."

          run_steps(steps, on_fail, on_success)


      @invenio_cli.command()
      @click.option("--script", required=True, help="The path of custom migration script.")
      @pass_cli_config
      def upgrade(cli_config, script):
          """Upgrades the current instance to a newer version."""
          steps = UpgradeCommands(cli_config).upgrade(script)
          on_fail = "Upgrade failed."
          on_success = "Upgrade sucessfull."

          run_steps(steps, on_fail, on_success)
    path: /usr/local/share/invenio-cli-patch/cli.py
    owner: 'root:root'
    permissions: '0664'
  - content: |
      #!/bin/bash
      # Scaffolds an RDM v14 instance running under Granian on standard
      # Python 3.14. Not run automatically by cloud-init -- ssh in after
      # boot and run this manually so each step can be watched/debugged.
      #
      # USAGE: setup_rdm_granian.bash [INSTANCE_NAME] [TEMPLATE_VERSION] [RDM_PIN_VERSION]
      #
      # TEMPLATE_VERSION defaults to "master": cookiecutter-invenio-rdm has
      # no v14.0 branch (branches stop at v13.0), confirmed 2026-07-27 via
      # `gh api repos/inveniosoftware/cookiecutter-invenio-rdm/branches`.
      # Unlike v13.0, master's own pyproject.toml already declares
      # requires-python >= 3.14 and a [tool.uv.workspace] with the site
      # package as a member -- the whole Pipfile-to-pyproject.toml
      # conversion hack the v13 script needed is gone entirely.
      #
      # RDM_PIN_VERSION is the exact invenio-app-rdm release to pin via
      # "uv add" after scaffolding -- master's template pins
      # ~=14.0.0b11.dev1 (a beta) by default; override to the latest
      # release candidate. Confirmed 2026-07-27 that v14.0.0rc2 (tagged
      # 2026-06-13) is still the latest v14 tag, no GA yet -- re-check
      # before reusing this script later.
      set -euo pipefail
      INSTANCE_NAME="${1:-rdm14-granian}"
      TEMPLATE_VERSION="${2:-master}"
      RDM_PIN_VERSION="${3:-14.0.0rc2}"
      # Python package/module names can't contain hyphens -- cookiecutter's
      # "package_name" must be the underscored form, distinct from
      # "project_shortname" (which stays hyphenated for directory/URL use).
      PACKAGE_NAME="$(echo "${INSTANCE_NAME}" | tr '-' '_')"

      export NVM_DIR="$HOME/.nvm"
      [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
      nvm use 22
      export PATH="$HOME/.local/bin:$PATH"

      # Real bug found via live testing 2026-07-27: invenio-assets'
      # devDependencies pin @rspack/core <1.7.0 while @rspack/cli 2.1.5's
      # own peer dependency wants ^2.0.0-0 -- an inconsistency in that
      # package's own package.json, not anything specific to this
      # project. npm (10.x, strict-by-default peer resolution) refuses to
      # install at all otherwise. Setting this persists to ~/.npmrc, so
      # it applies automatically to the npm install invenio-cli runs
      # internally during "invenio-cli install".
      echo "Configuring npm to tolerate invenio-assets' rspack peer-dependency conflict"
      npm config set legacy-peer-deps true

      sudo mkdir -p /Sites
      sudo chown "$USER" /Sites
      sudo chmod 775 /Sites
      cd /Sites

      echo "Writing cookiecutter config for ${INSTANCE_NAME} (template ${TEMPLATE_VERSION})"
      # master's cookiecutter.json dropped the "database"/"search"
      # picklist keys v13.0 had (search is now unconditionally
      # OpenSearch2, confirmed by reading the template's
      # pyproject.toml.j2 -- app_rdm_extras is hardcoded to
      # ['opensearch2']) and added "base_image"/"use_reduced_vocabs",
      # both left at their defaults here (debian / yes) since neither
      # was scoped as a decision for this round.
      #
      # Real bug found via live testing 2026-07-27: "database"/"search"
      # are STILL required, even though master's cookiecutter.json no
      # longer prompts for them -- invenio-cli 1.11.0 (latest PyPI
      # release, confirmed via its actual v1.11.0 tag on GitHub) writes
      # .invenio's [cookiecutter] section verbatim from whatever
      # cookiecutter replay context it receives, with no fallback
      # default, and later commands (e.g. "invenio-cli services start")
      # do a bare dict lookup for "database" with no default either --
      # so omitting it causes a KeyError at service-start time, not at
      # scaffold time, which is why this wasn't caught until later in the
      # process. (invenio-cli's unreleased master branch already fixes
      # this -- falls back to postgresql/opensearch2 and always writes
      # them -- but that fix hasn't shipped in a release yet.) Cookiecutter
      # itself accepts arbitrary extra_context keys even ones the
      # template's own cookiecutter.json doesn't define, so supplying
      # these here is enough to work around the gap.
      cat <<EOT >"/Sites/${INSTANCE_NAME}_${TEMPLATE_VERSION}.toml"
      [RDM]
      flavour = RDM
      logfile = /var/log/invenio-cli.log

      [cookiecutter]
      project_name = ${INSTANCE_NAME}
      project_shortname = ${INSTANCE_NAME}
      package_name = ${PACKAGE_NAME}
      project_site = ${INSTANCE_NAME}.local
      github_repo = caltechlibrary/${INSTANCE_NAME}
      description = ${INSTANCE_NAME} InvenioRDM Instance (Granian)
      author_name = Caltech Library
      author_email = help@library.caltech.edu
      year = $(date +%Y)
      database = postgresql
      search = opensearch2
      file_storage = local
      development_tools = yes
      site_code = yes
      _template = https://github.com/inveniosoftware/cookiecutter-invenio-rdm.git
      EOT

      echo "Initialising RDM template ${TEMPLATE_VERSION} into /Sites/${INSTANCE_NAME}"
      invenio-cli init rdm -c "$TEMPLATE_VERSION" --config "${INSTANCE_NAME}_${TEMPLATE_VERSION}.toml"
      cd "/Sites/${INSTANCE_NAME}"

      echo "Pinning this project's Python to 3.14 via uv"
      uv python pin 3.14

      echo "Removing template's default uWSGI dependencies (uwsgi/uwsgitop/uwsgi-tools)"
      # master's pyproject.toml always adds these three even though we're
      # replacing uWSGI with Granian. None of the three publish a Python
      # 3.14 wheel of any kind yet (confirmed 2026-07-27 via PyPI's JSON
      # API -- unrelated to the free-threading question, this gap exists
      # under standard 3.14 too) -- leaving them in risks a from-source
      # build failure under invenio-cli install, for a server we're not
      # even going to run.
      sed -i '/"uwsgi/d' pyproject.toml

      echo "Pinning invenio-app-rdm to ${RDM_PIN_VERSION} (latest release candidate)"
      uv add "invenio-app-rdm[opensearch2]==${RDM_PIN_VERSION}"

      echo "Adding granian as a dependency"
      uv add granian

      echo "Installing dependencies and building assets"
      invenio-cli install

      # No --no-demo-data: vanilla demo instance, invenio-cli's built-in
      # demo records load by default. file_storage=local means services
      # setup also auto-creates the default file storage location.
      invenio-cli services setup

      echo "Generating self-signed TLS cert (internal comparison instance"
      echo "behind a restricted security group, not a public endpoint --"
      echo "a real cert isn't needed, just one nginx can load)"
      if [ ! -f /etc/ssl/certs/nginx-selfsigned.crt ]; then
        sudo openssl req -x509 -nodes -days 3650 -newkey rsa:2048 \
          -keyout /etc/ssl/private/nginx-selfsigned.key \
          -out /etc/ssl/certs/nginx-selfsigned.crt \
          -subj "/CN=${INSTANCE_NAME}.local"
      fi
      if [ ! -f /etc/nginx/dhparam.pem ]; then
        sudo openssl dhparam -out /etc/nginx/dhparam.pem 2048
      fi
      sudo mkdir -p /etc/nginx/snippets
      cat <<EOT | sudo tee /etc/nginx/snippets/self-signed.conf >/dev/null
      ssl_certificate /etc/ssl/certs/nginx-selfsigned.crt;
      ssl_certificate_key /etc/ssl/private/nginx-selfsigned.key;
      EOT
      cat <<EOT | sudo tee /etc/nginx/snippets/ssl-params.conf >/dev/null
      ssl_protocols TLSv1.2 TLSv1.3;
      ssl_prefer_server_ciphers on;
      ssl_dhparam /etc/nginx/dhparam.pem;
      ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384;
      ssl_ecdh_curve secp384r1;
      ssl_session_cache shared:SSL:10m;
      ssl_session_tickets off;
      ssl_stapling off;
      ssl_stapling_verify off;
      resolver 127.0.0.53 valid=300s;
      resolver_timeout 5s;
      add_header X-Frame-Options DENY;
      add_header X-Content-Type-Options nosniff;
      EOT

      echo "Writing nginx site config"
      cat <<EOT >"${INSTANCE_NAME}_nginx.conf"

      server {
        server_name _;
        add_header Strict-Transport-Security "max-age=15768000";
        add_header X-Request-ID \$request_id;

        proxy_request_buffering off;
        proxy_buffering off;
        proxy_http_version 1.1;

        location / {
          proxy_pass http://127.0.0.1:5000;
          proxy_set_header Host \$host;
          proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto \$scheme;
          proxy_set_header X-Request-ID \$request_id;
          proxy_hide_header X-Session-ID;
          proxy_hide_header X-User-ID;
          client_max_body_size 100m;
        }
        location /api {
          proxy_pass http://127.0.0.1:5001;
          proxy_set_header Host \$host;
          proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto \$scheme;
          proxy_set_header X-Request-ID \$request_id;
          proxy_hide_header X-Session-ID;
          proxy_hide_header X-User-ID;
          client_max_body_size 100m;
        }
        location ~ /api/records/.+/draft/files/.+/content {
          gzip off;
          proxy_pass http://127.0.0.1:5001;
          proxy_set_header Host \$host;
          proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto \$scheme;
          proxy_set_header X-Request-ID \$request_id;
          proxy_hide_header X-Session-ID;
          proxy_hide_header X-User-ID;
          client_max_body_size 500G;
        }
      }

      server {
        server_name _;
        add_header Strict-Transport-Security "max-age=15768000";
        listen 80;
        listen [::]:80;
      }

      server {
        server_name _;
        include snippets/self-signed.conf;
        include snippets/ssl-params.conf;
        add_header Strict-Transport-Security "max-age=15768000";
        listen 443 ssl;
        listen [::]:443 ssl;
      }

      EOT
      sudo mv -v "${INSTANCE_NAME}_nginx.conf" "/etc/nginx/sites-available/${INSTANCE_NAME}.conf"
      sudo chown root:root "/etc/nginx/sites-available/${INSTANCE_NAME}.conf"
      sudo chmod 664 "/etc/nginx/sites-available/${INSTANCE_NAME}.conf"
      sudo ln -sf "/etc/nginx/sites-available/${INSTANCE_NAME}.conf" "/etc/nginx/sites-enabled/${INSTANCE_NAME}.conf"
      sudo rm -f "/etc/nginx/sites-enabled/default"
      sudo systemctl restart nginx

      echo "Writing .env"
      INVENIO_SECRET_KEY="$(makepasswd -char 64)"
      cat <<EOT >.env
      INVENIO_SECRET_KEY=${INVENIO_SECRET_KEY}
      INVENIO_LOGGING_CONSOLE_LEVEL=INFO
      FLASK_ENV=production
      EOT
      chmod 600 .env

      echo "Writing systemd unit files (Granian, provisional worker/thread"
      echo "counts carried over unexamined from the v13 uWSGI baseline --"
      echo "see header comment; not yet tuned)"
      cat <<EOT >rdm.service
      [Unit]
      Description=Launch InvenioRDM Web Interface (Granian, UI)

      [Service]
      Type=simple
      User=ubuntu
      StandardOutput=journal
      StandardError=journal
      WorkingDirectory=/Sites/${INSTANCE_NAME}
      EnvironmentFile=/Sites/${INSTANCE_NAME}/.env
      ExecStart=/home/ubuntu/.local/bin/uv run --no-sync granian --interface wsgi invenio_app.wsgi_ui:application --host 0.0.0.0 --port 5000 --workers 2 --blocking-threads 2

      [Install]
      WantedBy=multi-user.target
      EOT

      cat <<EOT >rdm_rest.service
      [Unit]
      Description=Launch InvenioRDM REST API (Granian)

      [Service]
      Type=simple
      User=ubuntu
      StandardOutput=journal
      StandardError=journal
      WorkingDirectory=/Sites/${INSTANCE_NAME}
      EnvironmentFile=/Sites/${INSTANCE_NAME}/.env
      ExecStart=/home/ubuntu/.local/bin/uv run --no-sync granian --interface wsgi invenio_app.wsgi_rest:application --host 0.0.0.0 --port 5001 --workers 4 --blocking-threads 2

      [Install]
      WantedBy=multi-user.target
      EOT

      cat <<EOT >rdm_celery.service
      [Unit]
      Description=Launch InvenioRDM Celery Worker

      [Service]
      Type=simple
      User=ubuntu
      StandardOutput=journal
      StandardError=journal
      WorkingDirectory=/Sites/${INSTANCE_NAME}
      EnvironmentFile=/Sites/${INSTANCE_NAME}/.env
      ExecStart=/home/ubuntu/.local/bin/uv run --no-sync celery --app invenio_app.celery worker --beat --events --loglevel INFO

      [Install]
      WantedBy=multi-user.target
      EOT

      sudo mv -v rdm.service rdm_rest.service rdm_celery.service /etc/systemd/system/
      sudo chown root:root /etc/systemd/system/rdm*.service
      sudo chmod 664 /etc/systemd/system/rdm*.service
      sudo systemctl daemon-reload
      sudo systemctl enable rdm rdm_rest rdm_celery

      cat <<EOT

         Granian RDM v14 instance "${INSTANCE_NAME}" scaffolded at /Sites/${INSTANCE_NAME}
         Python: 3.14 (via uv) | Storage: local disk (instance path)
         Postgres/OpenSearch: local EBS via Docker | Demo data loaded

         Dev workflow (recommended for day-to-day development -- no
         systemctl needed, one command starts/stops web+worker+beat):
             cd /Sites/${INSTANCE_NAME}
             invenio-cli services start
             invenio-cli run all --runner granian
             # Ctrl-C stops web+worker+beat together.
             invenio-cli services stop

         Production-style workflow (Granian/nginx under systemd, matches
         the intended deployment topology):
             cd /Sites/${INSTANCE_NAME}
             invenio-cli services start
             sudo systemctl start rdm_celery rdm_rest rdm nginx

         Check:
             invenio-cli services status
             sudo systemctl status rdm_celery rdm_rest rdm nginx

         Stop:
             sudo systemctl stop nginx rdm rdm_rest rdm_celery
             invenio-cli services stop

      EOT
    path: /usr/local/bin/setup_rdm_granian.bash
    owner: 'root:root'
    permissions: '0775'
