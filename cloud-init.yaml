#cloud-config
# Base machine for the RDM v14 + Granian bring-up (see ../DESIGN.md). Single
# instance, no paired Gunicorn comparison this round -- that question was
# already answered in the v13 round (see gunicorn-rdm-v13).
#
# Scope decisions confirmed 2026-07-27:
#   - arm64/Graviton (clasm v0.0.5 supports it).
#   - Ubuntu 26.04 LTS ("resolute").
#   - Standard (GIL-enabled) Python 3.14, managed entirely via uv -- NOT the
#     Ubuntu-provided Python. uv downloads and manages its own Python builds
#     independent of whatever python3 26.04 ships, so the OS-provided
#     interpreter is irrelevant to the app venv.
#
# FREE-THREADED PYTHON 3.14t WAS TRIED AND ABANDONED THIS ROUND, same day
# (2026-07-27) -- see DECISIONS.md, "Free-threaded Python 3.14t: tried,
# abandoned this round." Confirmed live: even after working around the
# psycopg2-binary/psycopg-binary/orjson wheel gaps (source builds + a
# ujson-based fallback shim), SQLAlchemy's own bundled `cyextension`
# (ships a cp314t-tagged wheel but hasn't declared itself thread-safe via
# Py_mod_gil) re-enables the GIL process-wide the moment the app loads --
# confirmed via `sys._is_gil_enabled()` returning False after
# `invenio_app.factory.create_app()`. That's a different, deeper class of
# gap than the wheel-availability ones (an ecosystem-maturity question,
# not something fixable by avoiding a specific package), so this round
# uses standard Python 3.14. Revisit 3.14t once SQLAlchemy and the other
# C-extension dependencies in this stack actually declare free-threading
# safety, not just ship cp314t-tagged wheels.
#
# Granian worker/thread flags below are carried over unexamined from the
# v13 uWSGI-matched baseline (UI 2x2, REST 4x2) -- explicitly a
# placeholder, not a tuned choice; tuning is deferred to its own pass
# once a working baseline boots, per DESIGN.md.
package_update: true
package_upgrade: true
fqdn: invenio-rdm14-granian.local
packages:
  - sshfs
  - build-essential
  - git
  - lynx
  - tmux
  - curl
  - rsync
  - nginx
  - imagemagick
  - pkg-config
  - libxml2-dev
  - libxmlsec1-dev
  - docker.io
  - docker-compose-v2
  - makepasswd
  - shellcheck
  - jq
groups:
  - docker
  - staff
  - www-data
runcmd:
  - adduser ubuntu docker
  - adduser ubuntu staff
  - adduser ubuntu www-data
  - /usr/local/bin/install_rdm_toolchain.bash
snap:
  commands:
    - snap install --classic certbot
write_files:
  - content: |
      #!/bin/bash
      # Installs uv, a uv-managed Python 3.14, invenio-cli (via "uv tool
      # install", not pip -- no PEP 668 externally-managed-environment
      # dance needed), and Node 26 (via nvm) -- everything
      # setup_rdm_granian.bash needs. Run once at boot via runcmd;
      # idempotent if rerun.
      set -euo pipefail

      # Installed as the ubuntu user (not root, which is what this script
      # otherwise runs as via runcmd) so everything lands in
      # /home/ubuntu/.local/bin, which is where setup_rdm_granian.bash's
      # PATH and the systemd units' ExecStart both expect to find it.
      echo "Installing uv for the ubuntu user..."
      sudo -u ubuntu -H bash -c 'curl -LsSf https://astral.sh/uv/install.sh | sh'

      echo "Installing Python 3.14 via uv..."
      sudo -u ubuntu -H bash -c 'export PATH="$HOME/.local/bin:$PATH"; uv python install 3.14'

      echo "Installing invenio-cli as a uv tool (isolated venv, own Python -- independent of any project's Python pin)..."
      sudo -u ubuntu -H bash -c 'export PATH="$HOME/.local/bin:$PATH"; uv tool install "invenio-cli==1.11.0"'

      echo "Installing nvm + Node 26 for the ubuntu user..."
      # Node 24+ is InvenioRDM v14.0's own documented requirement (see
      # https://inveniordm-dev.docs.cern.ch/releases/v14/version-v14.0/#requirements),
      # "tested with version 26+ too" -- using 26 here to match what upstream
      # actually validated, not just the floor. This is stricter than
      # invenio-cli==1.11.0's own check_dev() gate, which only asserts
      # Node >=18 for RDM >=12 (confirmed 2026-07-28 against the pinned
      # 1.11.0 release's actual requirements.py -- it has no RDM>=14-specific
      # branch; that only exists on invenio-cli's unreleased master branch,
      # which bumps the floor to >=22). Either way the RDM docs' floor is
      # what actually governs runtime/build compatibility.
      #
      # Real bug found via live testing 2026-07-27: git-cloning nvm
      # directly (instead of running its official installer) skips the
      # step that normally appends nvm's loader snippet to .bashrc. Only
      # a shell that explicitly sources nvm.sh gets node/npm on PATH --
      # this script's own subshell does, via the export/source lines
      # below, but any *later*, separate interactive SSH session would
      # not, so append the same loader snippet to .bashrc for every
      # future shell too.
      sudo -u ubuntu -H bash -c '
        set -euo pipefail
        if [ ! -d "$HOME/.nvm" ]; then
          git clone --depth 1 https://github.com/nvm-sh/nvm "$HOME/.nvm"
        fi
        export NVM_DIR="$HOME/.nvm"
        [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
        nvm install 26
        nvm alias default 26
        echo "" >> "$HOME/.bashrc"
        echo "export NVM_DIR=\"\$HOME/.nvm\"" >> "$HOME/.bashrc"
        echo "[ -s \"\$NVM_DIR/nvm.sh\" ] && . \"\$NVM_DIR/nvm.sh\"" >> "$HOME/.bashrc"
      '

      echo "Setting vm.max_map_count for OpenSearch..."
      cat <<EOT >/etc/sysctl.d/rdm_sysctl.conf
      vm.max_map_count=262144
      EOT
      sysctl --system

    path: /usr/local/bin/install_rdm_toolchain.bash
    owner: 'root:root'
    permissions: '0775'
  - content: |
      #!/bin/bash
      # ExecStartPre readiness gate for the rdm/rdm_rest/rdm_celery systemd
      # units (see ../cloud-init.yaml). A Docker container reporting "started"
      # is not the same as the service inside it actually accepting
      # connections -- that gap is the root cause identified in DESIGN.md's
      # "Follow-on: operability hardening" for reboot brittleness (PLAN.md
      # Step 7). This blocks until Postgres/Redis/RabbitMQ/OpenSearch on
      # 127.0.0.1 all respond, or exits non-zero after a bounded timeout so
      # systemd's Restart=on-failure retries the whole unit instead of the
      # ExecStart racing ahead against services that aren't ready yet.
      set -uo pipefail
      TIMEOUT_SECONDS=180
      INTERVAL_SECONDS=2
      DEADLINE=$(($(date +%s) + TIMEOUT_SECONDS))

      tcp_ready() {
        local host="$1" port="$2"
        (exec 3<>"/dev/tcp/${host}/${port}") 2>/dev/null
      }

      http_ready() {
        curl -fsS -o /dev/null --max-time 5 "$1"
      }

      wait_for() {
        local description="$1"
        shift
        while ! "$@"; do
          if [ "$(date +%s)" -ge "$DEADLINE" ]; then
            echo "Timed out after ${TIMEOUT_SECONDS}s waiting for ${description}" >&2
            return 1
          fi
          sleep "$INTERVAL_SECONDS"
        done
        echo "${description} is ready"
      }

      wait_for "Postgres (127.0.0.1:5432)" tcp_ready 127.0.0.1 5432
      wait_for "Redis/cache (127.0.0.1:6379)" tcp_ready 127.0.0.1 6379
      wait_for "RabbitMQ (127.0.0.1:5672)" tcp_ready 127.0.0.1 5672
      wait_for "OpenSearch (127.0.0.1:9200)" http_ready http://127.0.0.1:9200
    path: /usr/local/bin/wait_for_rdm_services.bash
    owner: 'root:root'
    permissions: '0775'
  - content: |
      #!/bin/bash
      # Step 7 acceptance script (see ../PLAN.md "Step 7 -- systemd reboot
      # hardening"). Run this manually right after `sudo reboot` -- not just
      # after a manual `systemctl start` sequence -- to confirm the instance
      # actually comes back up unattended. Exit 0 = every check passed;
      # nonzero = something is still broken.
      #
      # Deliberately standalone from wait_for_rdm_services.bash (the
      # production readiness gate baked into the systemd units via
      # ExecStartPre): this script is the outside observer confirming the gate
      # actually worked, not part of the gate itself. Keep this in the repo as
      # a standing regression check for any future edit to cloud-init.yaml's
      # systemd unit section.
      #
      # USAGE: verify_rdm_boot.bash [INSTANCE_NAME]
      set -uo pipefail
      INSTANCE_NAME="${1:-rdm14-granian}"
      FAILURES=0

      check() {
        local description="$1"
        shift
        if "$@"; then
          echo "OK   -- ${description}"
        else
          echo "FAIL -- ${description}"
          FAILURES=$((FAILURES + 1))
        fi
      }

      # shellcheck disable=SC2329  # called indirectly via check()'s "$@"
      units_active() {
        systemctl is-active --quiet docker rdm rdm_rest rdm_celery nginx
      }

      # shellcheck disable=SC2329  # called indirectly via check()'s "$@"
      api_responds() {
        local code
        code="$(curl -sk -o /dev/null -w '%{http_code}' --max-time 15 https://localhost/api/records)"
        [ "$code" = "200" ]
      }

      # shellcheck disable=SC2329  # called indirectly via check()'s "$@"
      celery_responds() {
        # Explicitly as ubuntu, regardless of which user runs this script --
        # uv and the project venv live under /home/ubuntu, and running this
        # as root (e.g. via `sudo`, or SSM's default execution user) silently
        # can't find `uv` at all, which looks identical to celery being dead.
        # Found live 2026-07-27: a manual ping as ubuntu succeeded instantly
        # while this check kept failing, because it was never really running
        # celery at all.
        #
        # Second bug found live the same day: piping straight into `grep -q`
        # (which exits the instant it finds a match, closing the pipe early)
        # sends SIGPIPE to the still-running celery process upstream -- with
        # `set -o pipefail` active, THAT non-zero exit, not grep's successful
        # match, became the pipeline's reported status. Capture the output via
        # command substitution first (fully waits, no live pipe to the
        # subprocess) and match against the captured string instead.
        local output
        output="$(sudo -u ubuntu -H bash -c "
          cd '/Sites/${INSTANCE_NAME}' &&
          export PATH=\"\$HOME/.local/bin:\$PATH\" &&
          timeout 15 uv run --no-sync celery --app invenio_app.celery inspect ping
        " 2>/dev/null)"
        grep -q "pong" <<< "$output"
      }

      check "docker/rdm/rdm_rest/rdm_celery/nginx are all systemctl active" units_active
      check "https://localhost/api/records responds 200" api_responds
      check "celery worker responds to inspect ping" celery_responds

      echo
      if [ "$FAILURES" -eq 0 ]; then
        echo "All checks passed."
        exit 0
      else
        echo "${FAILURES} check(s) failed."
        exit 1
      fi
    path: /usr/local/bin/verify_rdm_boot.bash
    owner: 'root:root'
    permissions: '0775'
  - content: |
      #!/bin/bash
      # Scaffolds an RDM v14 instance running under Granian on standard
      # Python 3.14. Not run automatically by cloud-init -- ssh in after
      # boot and run this manually so each step can be watched/debugged.
      #
      # USAGE: setup_rdm_granian.bash [INSTANCE_NAME] [TEMPLATE_VERSION] [RDM_PIN_VERSION]
      #
      # TEMPLATE_VERSION defaults to "v14.0": cookiecutter-invenio-rdm's
      # master branch moved on to targeting v15 betas (commit 5707760,
      # 2026-08-06) once v14 went GA -- but a real "v14.0" branch now
      # exists (it didn't as of 2026-07-27, when branches stopped at
      # v13.0; see DECISIONS.md's 2026-08-17 entry). v14.0's own
      # pyproject.toml pins invenio-app-rdm~=14.0.0 (a clean match for
      # GA, no forced downgrade) and requires-python ~=3.14.0. Like
      # master before it, v14.0 already declares a [tool.uv.workspace]
      # with the site package as a member -- the whole Pipfile-to-
      # pyproject.toml conversion hack the v13 script needed is gone
      # entirely.
      #
      # RDM_PIN_VERSION is the exact invenio-app-rdm release to pin via
      # "uv add" after scaffolding -- confirmed 2026-08-17 via PyPI that
      # 14.0.0 is the actual GA release (info.version, Production/Stable
      # classifier), reached via rc3 -> rc4 -> rc5 -> rc6 -> v14.0.0 --
      # re-check before reusing this script later, since upstream has
      # already tagged v15 betas past it.
      set -euo pipefail
      INSTANCE_NAME="${1:-rdm14-granian}"
      TEMPLATE_VERSION="${2:-v14.0}"
      RDM_PIN_VERSION="${3:-14.0.0}"
      # Python package/module names can't contain hyphens -- cookiecutter's
      # "package_name" must be the underscored form, distinct from
      # "project_shortname" (which stays hyphenated for directory/URL use).
      PACKAGE_NAME="$(echo "${INSTANCE_NAME}" | tr '-' '_')"

      export NVM_DIR="$HOME/.nvm"
      [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
      nvm use 26
      export PATH="$HOME/.local/bin:$PATH"

      # Real bug found via live testing 2026-07-27: invenio-assets'
      # devDependencies pin @rspack/core <1.7.0 while @rspack/cli 2.1.5's
      # own peer dependency wants ^2.0.0-0 -- an inconsistency in that
      # package's own package.json, not anything specific to this
      # project. npm (10.x, strict-by-default peer resolution) refuses to
      # install at all otherwise. Setting this persists to ~/.npmrc, so
      # it applies automatically to the npm install invenio-cli runs
      # internally during "invenio-cli install".
      echo "Configuring npm to tolerate invenio-assets' rspack peer-dependency conflict"
      npm config set legacy-peer-deps true

      sudo mkdir -p /Sites
      sudo chown "$USER" /Sites
      sudo chmod 775 /Sites
      cd /Sites

      echo "Writing cookiecutter config for ${INSTANCE_NAME} (template ${TEMPLATE_VERSION})"
      # master's cookiecutter.json dropped the "database"/"search"
      # picklist keys v13.0 had (search is now unconditionally
      # OpenSearch2, confirmed by reading the template's
      # pyproject.toml.j2 -- app_rdm_extras is hardcoded to
      # ['opensearch2']) and added "base_image"/"use_reduced_vocabs",
      # both left at their defaults here (debian / yes) since neither
      # was scoped as a decision for this round.
      #
      # Real bug found via live testing 2026-07-27: "database"/"search"
      # are STILL required, even though master's cookiecutter.json no
      # longer prompts for them -- invenio-cli 1.11.0 (latest PyPI
      # release, confirmed via its actual v1.11.0 tag on GitHub) writes
      # .invenio's [cookiecutter] section verbatim from whatever
      # cookiecutter replay context it receives, with no fallback
      # default, and later commands (e.g. "invenio-cli services setup")
      # do a bare dict lookup for "database" with no default either --
      # so omitting it causes a KeyError at service-setup time, not at
      # scaffold time, which is why this wasn't caught until later in the
      # process. (invenio-cli's unreleased master branch already fixes
      # this -- falls back to postgresql/opensearch2 and always writes
      # them -- but that fix hasn't shipped in a release yet.)
      #
      # CORRECTION, same day, confirmed by re-testing live: supplying
      # "database"/"search" as extra_context here does NOT work around
      # the gap, despite an earlier version of this comment claiming
      # otherwise -- cookiecutter's saved "replay" context (what actually
      # gets written into .invenio's [cookiecutter] section) only
      # retains keys that are part of the template's own cookiecutter.json
      # schema. master's schema no longer defines "database"/"search" at
      # all (confirmed: they're absent from the generated .invenio even
      # though they're right here in this file), so cookiecutter accepts
      # them as inert extra_context, uses them nowhere during templating,
      # and drops them from the replay -- the KeyError still happened on
      # a live instance with this exact config. Removed here; the real
      # fix is the direct .invenio patch right after "invenio-cli init"
      # below, which is the only place invenio-cli's own
      # get_db_type()/get_search_type() actually read from.
      cat <<EOT >"/Sites/${INSTANCE_NAME}_${TEMPLATE_VERSION}.toml"
      [RDM]
      flavour = RDM
      logfile = /var/log/invenio-cli.log

      [cookiecutter]
      project_name = ${INSTANCE_NAME}
      project_shortname = ${INSTANCE_NAME}
      package_name = ${PACKAGE_NAME}
      project_site = ${INSTANCE_NAME}.local
      github_repo = caltechlibrary/${INSTANCE_NAME}
      description = ${INSTANCE_NAME} InvenioRDM Instance (Granian)
      author_name = Caltech Library
      author_email = help@library.caltech.edu
      year = $(date +%Y)
      file_storage = local
      development_tools = yes
      site_code = yes
      _template = https://github.com/inveniosoftware/cookiecutter-invenio-rdm.git
      EOT

      echo "Initialising RDM template ${TEMPLATE_VERSION} into /Sites/${INSTANCE_NAME}"
      invenio-cli init rdm -c "$TEMPLATE_VERSION" --config "${INSTANCE_NAME}_${TEMPLATE_VERSION}.toml"
      cd "/Sites/${INSTANCE_NAME}"

      echo "Patching .invenio: injecting database/search keys directly --"
      echo "see the comment above the cookiecutter config heredoc for why"
      echo "extra_context alone doesn't work"
      if ! grep -q '^database = ' .invenio; then
        sed -i '/^\[cookiecutter\]/a database = postgresql\nsearch = opensearch2' .invenio
      fi

      echo "Preparing host-side OpenSearch snapshot repo dir and patching"
      echo "docker-services.yml so the search container can write to it"
      # /opt/rdm_opensearch_backups mirrors this project's /opt/rdm_sql_backups
      # convention. cookiecutter-invenio-rdm's stock docker-services.yml
      # (confirmed against the real master-branch template, not guessed) has
      # no snapshot-repo volume or path.repo setting on the search service --
      # OpenSearch refuses to register a filesystem repository without both,
      # which is the most likely reason earlier OpenSearch backup attempts
      # (2024/early 2025) never worked.
      sudo mkdir -p /opt/rdm_opensearch_backups
      # opensearchproject/opensearch's official image runs as uid:gid 1000:1000;
      # a bind-mounted snapshot dir must be owned by that uid or the container
      # can't write to it. Confirm this uid on the first real boot.
      sudo chown 1000:1000 /opt/rdm_opensearch_backups
      sudo chmod 775 /opt/rdm_opensearch_backups

      # path.repo as a bare scalar (matching how discovery.type=single-node is
      # already set here) -- OpenSearch's env-to-yaml translation should coerce
      # a single path into the one-element list path.repo expects, but this is
      # unverified against a real container; confirm on first boot.
      sed -i '\#- search_data:/usr/share/opensearch/data#a\      - /opt/rdm_opensearch_backups:/usr/share/opensearch/backups' docker-services.yml
      sed -i '\#- "discovery.type=single-node"#a\      - "path.repo=/usr/share/opensearch/backups"' docker-services.yml

      echo "Pinning this project's Python to 3.14 via uv"
      uv python pin 3.14

      echo "Removing template's default uWSGI dependencies (uwsgi/uwsgitop/uwsgi-tools)"
      # master's pyproject.toml always adds these three even though we're
      # replacing uWSGI with Granian. None of the three publish a Python
      # 3.14 wheel of any kind yet (confirmed 2026-07-27 via PyPI's JSON
      # API -- unrelated to the free-threading question, this gap exists
      # under standard 3.14 too) -- leaving them in risks a from-source
      # build failure under invenio-cli install, for a server we're not
      # even going to run.
      sed -i '/"uwsgi/d' pyproject.toml

      echo "Pinning invenio-app-rdm to ${RDM_PIN_VERSION} (latest release candidate)"
      uv add "invenio-app-rdm[opensearch2]==${RDM_PIN_VERSION}"

      echo "Adding granian as a dependency"
      uv add granian

      echo "Installing dependencies and building assets"
      invenio-cli install

      # No --no-demo-data: vanilla demo instance, invenio-cli's built-in
      # demo records load by default. file_storage=local means services
      # setup also auto-creates the default file storage location.
      invenio-cli services setup

      echo "Generating self-signed TLS cert (internal comparison instance"
      echo "behind a restricted security group, not a public endpoint --"
      echo "a real cert isn't needed, just one nginx can load)"
      if [ ! -f /etc/ssl/certs/nginx-selfsigned.crt ]; then
        sudo openssl req -x509 -nodes -days 3650 -newkey rsa:2048 \
          -keyout /etc/ssl/private/nginx-selfsigned.key \
          -out /etc/ssl/certs/nginx-selfsigned.crt \
          -subj "/CN=${INSTANCE_NAME}.local"
      fi
      if [ ! -f /etc/nginx/dhparam.pem ]; then
        sudo openssl dhparam -out /etc/nginx/dhparam.pem 2048
      fi
      sudo mkdir -p /etc/nginx/snippets
      cat <<EOT | sudo tee /etc/nginx/snippets/self-signed.conf >/dev/null
      ssl_certificate /etc/ssl/certs/nginx-selfsigned.crt;
      ssl_certificate_key /etc/ssl/private/nginx-selfsigned.key;
      EOT
      cat <<EOT | sudo tee /etc/nginx/snippets/ssl-params.conf >/dev/null
      ssl_protocols TLSv1.2 TLSv1.3;
      ssl_prefer_server_ciphers on;
      ssl_dhparam /etc/nginx/dhparam.pem;
      ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384;
      ssl_ecdh_curve secp384r1;
      ssl_session_cache shared:SSL:10m;
      ssl_session_tickets off;
      ssl_stapling off;
      ssl_stapling_verify off;
      resolver 127.0.0.53 valid=300s;
      resolver_timeout 5s;
      add_header X-Frame-Options DENY;
      add_header X-Content-Type-Options nosniff;
      EOT

      echo "Writing nginx site config"
      # Real bug found via live testing 2026-07-27 (Step 7 verification):
      # the proxy "location" blocks used to live in a server block with
      # NO "listen" directive of its own -- nginx defaults that to
      # "listen 80", which then collided with the *separate*, explicit
      # "listen 80" block below it (both declaring "server_name _;" on
      # the same socket), logged as "conflicting server name \"_\" on
      # 0.0.0.0:80, ignored". Whichever block nginx picked, the TLS
      # (443, ssl) block had NO location blocks of its own at all -- so
      # every HTTPS request (the actual intended access path, and what
      # verify_rdm_boot.bash checks) fell through to nginx's own compiled-
      # in default root ("/usr/share/nginx/html"), a bare 404, not our
      # app. Fixed by collapsing to two server blocks: plain HTTP (80)
      # that redirects to HTTPS, and the actual TLS (443) block carrying
      # every "location" -- this is the only block that now needs them.
      cat <<EOT >"${INSTANCE_NAME}_nginx.conf"

      server {
        server_name _;
        listen 80;
        listen [::]:80;
        return 301 https://\$host\$request_uri;
      }

      server {
        server_name _;
        include snippets/self-signed.conf;
        include snippets/ssl-params.conf;
        add_header Strict-Transport-Security "max-age=15768000";
        add_header X-Request-ID \$request_id;
        listen 443 ssl;
        listen [::]:443 ssl;

        proxy_request_buffering off;
        proxy_buffering off;
        proxy_http_version 1.1;

        location / {
          proxy_pass http://127.0.0.1:5000;
          proxy_set_header Host \$host;
          proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto \$scheme;
          proxy_set_header X-Request-ID \$request_id;
          proxy_hide_header X-Session-ID;
          proxy_hide_header X-User-ID;
          client_max_body_size 100m;
        }
        # Real bug found via live testing 2026-07-27 (Step 7 verification):
        # every /api/* request 404'd, including paths with confirmed
        # indexed data (e.g. /api/vocabularies/languages) -- ruled out
        # both "no demo data" and "OpenSearch still indexing" (a 200
        # with an empty result, or a 500, would look different; this was
        # a bare Werkzeug "no URL rule" 404). Root cause: confirmed live
        # that invenio_app.wsgi_rest:application (port 5001, the REST-
        # only Granian process) mounts every API blueprint at the root
        # ("/records" returns 200 with real data), NOT under "/api" --
        # that prefix is nginx's job to strip before proxying, which
        # "proxy_pass http://127.0.0.1:5001;" (no trailing slash, so
        # nginx forwards the full unmodified URI) never did. A trailing
        # slash on proxy_pass makes nginx replace the matched location
        # prefix with it instead of preserving the full path.
        location /api {
          proxy_pass http://127.0.0.1:5001/;
          proxy_set_header Host \$host;
          proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto \$scheme;
          proxy_set_header X-Request-ID \$request_id;
          proxy_hide_header X-Session-ID;
          proxy_hide_header X-User-ID;
          client_max_body_size 100m;
        }
        # Regex locations can't use proxy_pass's trailing-slash prefix-
        # strip trick -- the /api/ prefix must be dropped explicitly via
        # a capture group instead.
        location ~ ^/api/(records/.+/draft/files/.+/content)$ {
          gzip off;
          proxy_pass http://127.0.0.1:5001/\$1;
          proxy_set_header Host \$host;
          proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto \$scheme;
          proxy_set_header X-Request-ID \$request_id;
          proxy_hide_header X-Session-ID;
          proxy_hide_header X-User-ID;
          client_max_body_size 500G;
        }
      }

      EOT
      sudo mv -v "${INSTANCE_NAME}_nginx.conf" "/etc/nginx/sites-available/${INSTANCE_NAME}.conf"
      sudo chown root:root "/etc/nginx/sites-available/${INSTANCE_NAME}.conf"
      sudo chmod 664 "/etc/nginx/sites-available/${INSTANCE_NAME}.conf"
      sudo ln -sf "/etc/nginx/sites-available/${INSTANCE_NAME}.conf" "/etc/nginx/sites-enabled/${INSTANCE_NAME}.conf"
      sudo rm -f "/etc/nginx/sites-enabled/default"
      sudo systemctl restart nginx

      echo "Writing .env"
      INVENIO_SECRET_KEY="$(makepasswd -char 64)"
      cat <<EOT >.env
      INVENIO_SECRET_KEY=${INVENIO_SECRET_KEY}
      INVENIO_LOGGING_CONSOLE_LEVEL=INFO
      FLASK_ENV=production
      EOT
      chmod 600 .env

      echo "Writing systemd unit files (Granian, provisional worker/thread"
      echo "counts carried over unexamined from the v13 uWSGI baseline --"
      echo "see header comment; not yet tuned)"
      #
      # Reboot-reliability hardening (PLAN.md Step 7, DESIGN.md "Follow-on:
      # operability hardening"): each unit now waits on docker.service
      # (Requires=/After=) AND on the backing services actually accepting
      # connections (ExecStartPre=wait_for_rdm_services.bash) -- Docker's
      # own daemon coming up is not the same as the Postgres/OpenSearch/
      # RabbitMQ containers it restarts (via their own "restart:
      # unless-stopped" policy) being ready yet, which is what made the
      # previous unordered units race on reboot. Restart=on-failure lets
      # systemd retry automatically instead of needing a manual restart.
      cat <<EOT >rdm.service
      [Unit]
      Description=Launch InvenioRDM Web Interface (Granian, UI)
      After=docker.service network-online.target
      Requires=docker.service
      Wants=network-online.target

      [Service]
      Type=simple
      User=ubuntu
      StandardOutput=journal
      StandardError=journal
      WorkingDirectory=/Sites/${INSTANCE_NAME}
      EnvironmentFile=/Sites/${INSTANCE_NAME}/.env
      ExecStartPre=/usr/local/bin/wait_for_rdm_services.bash
      ExecStart=/home/ubuntu/.local/bin/uv run --no-sync granian --interface wsgi invenio_app.wsgi_ui:application --host 0.0.0.0 --port 5000 --workers 2 --blocking-threads 2
      Restart=on-failure
      RestartSec=5

      [Install]
      WantedBy=multi-user.target
      EOT

      cat <<EOT >rdm_rest.service
      [Unit]
      Description=Launch InvenioRDM REST API (Granian)
      After=docker.service network-online.target
      Requires=docker.service
      Wants=network-online.target

      [Service]
      Type=simple
      User=ubuntu
      StandardOutput=journal
      StandardError=journal
      WorkingDirectory=/Sites/${INSTANCE_NAME}
      EnvironmentFile=/Sites/${INSTANCE_NAME}/.env
      ExecStartPre=/usr/local/bin/wait_for_rdm_services.bash
      ExecStart=/home/ubuntu/.local/bin/uv run --no-sync granian --interface wsgi invenio_app.wsgi_rest:application --host 0.0.0.0 --port 5001 --workers 4 --blocking-threads 2
      Restart=on-failure
      RestartSec=5

      [Install]
      WantedBy=multi-user.target
      EOT

      cat <<EOT >rdm_celery.service
      [Unit]
      Description=Launch InvenioRDM Celery Worker
      After=docker.service network-online.target
      Requires=docker.service
      Wants=network-online.target

      [Service]
      Type=simple
      User=ubuntu
      StandardOutput=journal
      StandardError=journal
      WorkingDirectory=/Sites/${INSTANCE_NAME}
      EnvironmentFile=/Sites/${INSTANCE_NAME}/.env
      ExecStartPre=/usr/local/bin/wait_for_rdm_services.bash
      ExecStart=/home/ubuntu/.local/bin/uv run --no-sync celery --app invenio_app.celery worker --beat --events --loglevel INFO
      Restart=on-failure
      RestartSec=5

      [Install]
      WantedBy=multi-user.target
      EOT

      echo "Writing rdm.target (single start/stop/enable point for"
      echo "rdm+rdm_rest+rdm_celery+nginx together) and an nginx drop-in"
      echo "so nginx orders itself after the app units on boot"
      cat <<EOT >rdm.target
      [Unit]
      Description=InvenioRDM Granian bring-up (rdm + rdm_rest + rdm_celery + nginx)
      Wants=rdm.service rdm_rest.service rdm_celery.service nginx.service
      After=rdm.service rdm_rest.service rdm_celery.service nginx.service

      [Install]
      WantedBy=multi-user.target
      EOT

      sudo mkdir -p /etc/systemd/system/nginx.service.d
      cat <<EOT | sudo tee /etc/systemd/system/nginx.service.d/rdm-ordering.conf >/dev/null
      [Unit]
      # Soft ordering only (no Requires=) -- nginx doesn't need the app up
      # to itself start, this just avoids confusing early 502s on boot.
      After=rdm.service rdm_rest.service
      EOT

      sudo mv -v rdm.service rdm_rest.service rdm_celery.service rdm.target /etc/systemd/system/
      sudo chown root:root /etc/systemd/system/rdm*.service /etc/systemd/system/rdm.target
      sudo chmod 664 /etc/systemd/system/rdm*.service /etc/systemd/system/rdm.target
      sudo systemctl daemon-reload
      sudo systemctl enable rdm rdm_rest rdm_celery rdm.target

      cat <<EOT

         Granian RDM v14 instance "${INSTANCE_NAME}" scaffolded at /Sites/${INSTANCE_NAME}
         Python: 3.14 (via uv) | Storage: local disk (instance path)
         Postgres/OpenSearch: local EBS via Docker | Demo data loaded

         Production-style workflow (Granian/nginx under systemd, matches
         the intended deployment topology). Docker's own restart policy
         (see docker-services.yml) brings the backing containers back on
         every reboot automatically -- "invenio-cli services start" is
         only needed the first time, not after every reboot:
             cd /Sites/${INSTANCE_NAME}
             invenio-cli services start   # first time only
             sudo systemctl start rdm.target   # or: start rdm_celery rdm_rest rdm nginx

         Check:
             invenio-cli services status
             sudo systemctl status rdm.target
             /usr/local/bin/verify_rdm_boot.bash ${INSTANCE_NAME}   # full acceptance check, esp. after a reboot

         Stop:
             sudo systemctl stop rdm.target
             invenio-cli services stop

      EOT
    path: /usr/local/bin/setup_rdm_granian.bash
    owner: 'root:root'
    permissions: '0775'
