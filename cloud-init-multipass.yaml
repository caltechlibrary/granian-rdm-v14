#cloud-config
# LOCAL MULTIPASS VARIANT of cloud-init.yaml (see NOTES.md, 2026-07-27,
# "candidate follow-on: local Multipass variant for day-to-day dev on a
# Mac Mini"). Byte-identical to cloud-init.yaml except for this header --
# nothing else needed AWS-specific changes: no IAM/SSM/instance-metadata
# calls anywhere in the original, just package installs, write_files, and
# systemd units, all of which apply equally to a local qemu VM. Launch
# with `multipass launch 26.04 --cloud-init cloud-init-multipass.yaml`.
# Sized for a Mac Mini host (8 cores/16GB total) rather than
# m6g.2xlarge's 8 vCPU/32GB -- pick a smaller --cpus/--memory/--disk at
# launch time (e.g. 4/8G/40G); this file itself carries no size directive.
# Reach the instance directly via `multipass shell` (or its
# `multipass info` IP) instead of SSM/SSH-over-restricted-security-group.
# If this diverges from cloud-init.yaml later, reconcile fixes both ways.
#
# Base machine for the RDM v14 + Granian bring-up (see ../DESIGN.md). Single
# instance, no paired Gunicorn comparison this round -- that question was
# already answered in the v13 round (see gunicorn-rdm-v13).
#
# Scope decisions confirmed 2026-07-27:
#   - arm64/Graviton (clasm v0.0.5 supports it) on AWS; Multipass on this
#     Mac Mini also runs arm64 natively, so no cross-arch wheel concerns.
#   - Ubuntu 26.04 LTS ("resolute").
#   - Standard (GIL-enabled) Python 3.14, managed entirely via uv -- NOT the
#     Ubuntu-provided Python. uv downloads and manages its own Python builds
#     independent of whatever python3 26.04 ships, so the OS-provided
#     interpreter is irrelevant to the app venv.
#
# FREE-THREADED PYTHON 3.14t WAS TRIED AND ABANDONED THIS ROUND, same day
# (2026-07-27) -- see DECISIONS.md, "Free-threaded Python 3.14t: tried,
# abandoned this round." Confirmed live: even after working around the
# psycopg2-binary/psycopg-binary/orjson wheel gaps (source builds + a
# ujson-based fallback shim), SQLAlchemy's own bundled `cyextension`
# (ships a cp314t-tagged wheel but hasn't declared itself thread-safe via
# Py_mod_gil) re-enables the GIL process-wide the moment the app loads --
# confirmed via `sys._is_gil_enabled()` returning False after
# `invenio_app.factory.create_app()`. That's a different, deeper class of
# gap than the wheel-availability ones (an ecosystem-maturity question,
# not something fixable by avoiding a specific package), so this round
# uses standard Python 3.14. Revisit 3.14t once SQLAlchemy and the other
# C-extension dependencies in this stack actually declare free-threading
# safety, not just ship cp314t-tagged wheels.
#
# Granian worker/thread flags below are carried over unexamined from the
# v13 uWSGI-matched baseline (UI 2x2, REST 4x2) -- explicitly a
# placeholder, not a tuned choice; tuning is deferred to its own pass
# once a working baseline boots, per DESIGN.md.
package_update: true
package_upgrade: true
fqdn: invenio-rdm14-granian.local
packages:
  - sshfs
  - build-essential
  - git
  - lynx
  - tmux
  - curl
  - rsync
  - nginx
  - imagemagick
  - pkg-config
  - libxml2-dev
  - libxmlsec1-dev
  - docker.io
  - docker-compose-v2
  - makepasswd
  - shellcheck
  - jq
groups:
  - docker
  - staff
  - www-data
runcmd:
  - adduser ubuntu docker
  - adduser ubuntu staff
  - adduser ubuntu www-data
  - /usr/local/bin/install_rdm_toolchain.bash
snap:
  commands:
    - snap install --classic certbot
write_files:
  - content: |
      #!/bin/bash
      # Installs uv, a uv-managed Python 3.14, invenio-cli (via "uv tool
      # install", not pip -- no PEP 668 externally-managed-environment
      # dance needed), and Node 22 (via nvm) -- everything
      # setup_rdm_granian.bash needs. Run once at boot via runcmd;
      # idempotent if rerun.
      set -euo pipefail

      # Installed as the ubuntu user (not root, which is what this script
      # otherwise runs as via runcmd) so everything lands in
      # /home/ubuntu/.local/bin, which is where setup_rdm_granian.bash's
      # PATH and the systemd units' ExecStart both expect to find it.
      echo "Installing uv for the ubuntu user..."
      sudo -u ubuntu -H bash -c 'curl -LsSf https://astral.sh/uv/install.sh | sh'

      echo "Installing Python 3.14 via uv..."
      sudo -u ubuntu -H bash -c 'export PATH="$HOME/.local/bin:$PATH"; uv python install 3.14'

      echo "Installing invenio-cli as a uv tool (isolated venv, own Python -- independent of any project's Python pin)..."
      # Exact pin, not ">=" -- the dev-runner patch just below overwrites
      # two of invenio-cli's own files by *copy*, not by applying a diff,
      # so it's only valid against the exact release it was diffed from.
      # See ../PLAN.md Step 6's "Diff vs. upstream" note before bumping
      # this: re-diff against the new release's local.py/cli.py first,
      # since a newer release's real fixes would otherwise be silently
      # discarded by the overwrite below.
      sudo -u ubuntu -H bash -c 'export PATH="$HOME/.local/bin:$PATH"; uv tool install "invenio-cli==1.11.0"'

      echo "Applying granian-rdm-v14's invenio-cli dev-runner patch (adds"
      echo "'invenio-cli run --runner granian' + labeled [web]/[worker]/[beat]"
      echo "output -- see ~/WorkLab/granian-rdm-v14/PLAN.md Step 6)..."
      sudo -u ubuntu -H bash -c 'export PATH="$HOME/.local/bin:$PATH"; /usr/local/bin/apply_invenio_cli_patch.bash'

      echo "Installing nvm + Node 22 for the ubuntu user..."
      # Node 22 is a hard requirement for RDM >=14, not 18 -- confirmed
      # 2026-07-27 directly against invenio-cli's own
      # RequirementsCommands.check_dev() (node_version = 22 when
      # rdm_major_version >= 14). Using Node 18 here would fail invenio-cli's
      # own pre-flight check.
      #
      # Real bug found via live testing 2026-07-27: git-cloning nvm
      # directly (instead of running its official installer) skips the
      # step that normally appends nvm's loader snippet to .bashrc. Only
      # a shell that explicitly sources nvm.sh gets node/npm on PATH --
      # this script's own subshell does, via the export/source lines
      # below, but any *later*, separate interactive SSH session would
      # not, so append the same loader snippet to .bashrc for every
      # future shell too.
      sudo -u ubuntu -H bash -c '
        set -euo pipefail
        if [ ! -d "$HOME/.nvm" ]; then
          git clone --depth 1 https://github.com/nvm-sh/nvm "$HOME/.nvm"
        fi
        export NVM_DIR="$HOME/.nvm"
        [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
        nvm install 26
        nvm alias default 26
        echo "" >> "$HOME/.bashrc"
        echo "export NVM_DIR=\"\$HOME/.nvm\"" >> "$HOME/.bashrc"
        echo "[ -s \"\$NVM_DIR/nvm.sh\" ] && . \"\$NVM_DIR/nvm.sh\"" >> "$HOME/.bashrc"
      '

      echo "Setting vm.max_map_count for OpenSearch..."
      cat <<EOT >/etc/sysctl.d/rdm_sysctl.conf
      vm.max_map_count=262144
      EOT
      sysctl --system

    path: /usr/local/bin/install_rdm_toolchain.bash
    owner: 'root:root'
    permissions: '0775'
  - content: |
      #!/bin/bash
      # Applies granian-rdm-v14's invenio-cli dev-runner patch (--runner
      # flask|granian on "invenio-cli run" + labeled [web]/[worker]/[beat]
      # output) over an installed `uv tool install invenio-cli==1.11.0`.
      # See ~/WorkLab/granian-rdm-v14/PLAN.md Step 6 for the diff-vs-upstream
      # note and vendor/invenio_cli/ for the source of truth + tests these
      # two files are copied from. Idempotent if rerun (plain file copy).
      set -euo pipefail
      export PATH="$HOME/.local/bin:$PATH"

      TOOL_DIR="$(uv tool dir)/invenio-cli"
      PKG_DIR="$("$TOOL_DIR/bin/python3" -c \
        "import invenio_cli, os; print(os.path.dirname(invenio_cli.__file__))")"

      cp -v /usr/local/share/invenio-cli-patch/local.py "$PKG_DIR/commands/local.py"
      cp -v /usr/local/share/invenio-cli-patch/cli.py "$PKG_DIR/cli/cli.py"

      # Fail loudly at provision time, not silently at first dev use, if
      # the patch didn't actually apply: import both patched modules
      # (catches syntax errors from a bad copy) and confirm the new
      # option is really wired into run_web's signature.
      "$TOOL_DIR/bin/python3" <<'PYEOF'
      import inspect
      import invenio_cli.cli.cli
      import invenio_cli.commands.local as local

      assert "runner" in inspect.signature(local.LocalCommands.run_web).parameters, (
          "invenio-cli dev-runner patch did not apply: "
          "LocalCommands.run_web has no 'runner' parameter"
      )
      print("invenio-cli dev-runner patch verified OK")
      PYEOF
    path: /usr/local/bin/apply_invenio_cli_patch.bash
    owner: 'root:root'
    permissions: '0775'
  - content: |
      # -*- coding: utf-8 -*-
      #
      # Copyright (C) 2026 California Institute of Technology.
      # Copyright (C) 2020 CERN.
      # Copyright (C) 2022 Graz University of Technology.
      # Copyright (C) 2026 Northwestern University.
      #
      # Invenio-Cli is free software; you can redistribute it and/or modify it
      # under the terms of the MIT License; see LICENSE file for more details.

      """Invenio module to ease the creation and management of applications."""

      import os
      import signal
      from distutils.dir_util import copy_tree
      from os import environ
      from pathlib import Path
      from shutil import copyfile
      from subprocess import PIPE, STDOUT
      from subprocess import Popen as popen
      from threading import Thread

      import click

      from ..helpers import env, filesystem
      from ..helpers.process import ProcessResponse, run_interactive
      from ..helpers.versions import rdm_version
      from .commands import Commands


      class LocalCommands(Commands):
          """Local CLI commands."""

          def __init__(self, cli_config):
              """Constructor."""
              super().__init__(cli_config)

          def _symlink_assets_templates(self, files_to_link):
              """Symlink the assets folder."""
              assets = "assets"
              click.secho("Symlinking {}...".format(assets), fg="green")

              instance_path = self.cli_config.get_instance_path()
              project_dir = self.cli_config.get_project_dir()
              for file_path in files_to_link:
                  file_path = Path(file_path)
                  relative_path = file_path.relative_to(instance_path)
                  target_path = project_dir / relative_path
                  filesystem.force_symlink(target_path, file_path)

          def _copy_statics_and_assets(self):
              """Copy project's statics and assets into instance dir."""
              click.secho("Copying project statics and assets...", fg="green")

              # static and assets folders do not exist in non-RDM contexts
              rdm_static_dir_exists = os.path.exists("static")
              rdm_assets_dir_exists = os.path.exists("assets")

              if rdm_static_dir_exists:
                  static = "static"
                  src_dir = self.cli_config.get_project_dir() / static
                  src_dir = str(src_dir)  # copy_tree below doesn't accept Path objects
                  dst_dir = self.cli_config.get_instance_path() / static
                  dst_dir = str(dst_dir)
                  # using it for a different purpose then intended but very useful
                  copy_tree(src_dir, dst_dir)

              if rdm_assets_dir_exists:
                  assets = "assets"
                  src_dir = self.cli_config.get_project_dir() / assets
                  src_dir = str(src_dir)
                  dst_dir = self.cli_config.get_instance_path() / assets
                  dst_dir = str(dst_dir)
                  # The full path to the files that were copied is returned
                  return copy_tree(src_dir, dst_dir)
              return []

          def _statics(self):
              # Symlink the instance's statics and assets
              copied_files = self._copy_statics_and_assets()
              self._symlink_assets_templates(copied_files)
              return ProcessResponse(
                  output="Assets and statics updated.",
                  status_code=0,
              )

          def _copy_js_lock_files(self):
              """Copy js lock files."""
              instance_path = self.cli_config.get_instance_path()
              project_dir = self.cli_config.get_project_dir()

              lock_file = self.cli_config.javascript_package_manager.lock_file_name
              source_path = project_dir / lock_file
              target_path = instance_path / "assets" / lock_file
              if Path(source_path).exists():
                  copyfile(source_path, target_path)

              source_path = project_dir / "package.json"
              target_path = instance_path / "assets" / "package.json"
              if Path(source_path).exists():
                  copyfile(source_path, target_path)

              return ProcessResponse(
                  output="Copied js lock files to instance.", status_code=0
              )

          def update_statics_and_assets(self, force, debug=False, log_file=None):
              """High-level command to update less/js/images/... files.

              Needed here (parent) because is used by Assets and Install commands.
              """
              # Commands
              py_pkg_man = self.cli_config.python_package_manager
              js_pkg_man = self.cli_config.javascript_package_manager
              ops = [py_pkg_man.run_command("invenio", "collect", "--verbose")]

              if force:
                  ops.append(py_pkg_man.run_command("invenio", "webpack", "clean", "create"))
                  # We need to copy the js lock files here, since webpack regenerates
                  # package.json and we want the locked version instead.
                  ops.append(self._copy_js_lock_files)
                  ops.append(py_pkg_man.run_command("invenio", "webpack", "install"))
              else:
                  ops.append(py_pkg_man.run_command("invenio", "webpack", "create"))
                  # We need to copy the js lock files here, since webpack regenerates
                  # package.json and we want the locked version instead.
                  ops.append(self._copy_js_lock_files)
              ops.append(self._statics)
              ops.append(py_pkg_man.run_command("invenio", "webpack", "build"))

              # Keep the same messages for some of the operations for backward compatibility
              messages = {
                  "build": "Building assets...",
                  "install": "Installing JS dependencies...",
              }

              with env(FLASK_DEBUG="1" if debug else "0"):
                  for op in ops:
                      if callable(op):
                          response = op()
                      else:
                          if op[-1] in messages:
                              click.secho(messages[op[-1]], fg="green")
                          response = run_interactive(
                              op,
                              env={"PIPENV_VERBOSITY": "-1", **js_pkg_man.env_overrides()},
                              log_file=log_file,
                          )
                      if response.status_code != 0:
                          break
              return response

          def _handle_sigint(self, name, process):
              """Terminate services on SIGINT."""
              prev_handler = signal.getsignal(signal.SIGINT)

              def _signal_handler(sig, frame):
                  click.secho(f"Stopping {name}...", fg="green")
                  process.terminate()
                  click.secho(f"{name} stopped...", fg="green")
                  if prev_handler is not None:
                      prev_handler(sig, frame)

              signal.signal(signal.SIGINT, _signal_handler)

          def _echo_labeled_output(self, label, proc):
              """Echo *proc*'s combined stdout/stderr, prefixed with *label*.

              Runs in a background thread (see `_labeled_popen`) so concurrently
              running processes (web/worker/beat) don't interleave unlabeled.
              """
              for line in proc.stdout:
                  click.secho(f"[{label}] {line.rstrip()}", fg="cyan")

          def _labeled_popen(self, label, command, env=None):
              """Run *command* via Popen, echoing its output prefixed with *label*."""
              proc = popen(
                  command,
                  stdout=PIPE,
                  stderr=STDOUT,
                  text=True,
                  bufsize=1,
                  env=env,
              )
              thread = Thread(
                  target=self._echo_labeled_output,
                  args=(label, proc),
                  daemon=True,
              )
              thread.start()
              return proc

          def run_web(self, host, port, debug=True, runner="flask"):
              """Run development server.

              :param runner: "flask" (default, stock `invenio run` dev server) or
                  "granian" (matches this project's production Granian runtime).
              """
              click.secho("Starting up local (development) server...", fg="green")
              run_env = environ.copy()
              run_env["FLASK_DEBUG"] = "1" if debug else "0"
              pkg_man = self.cli_config.python_package_manager

              if runner == "flask":
                  command = pkg_man.run_command(
                      "invenio",
                      "run",
                      "--cert",
                      "docker/nginx/test.crt",
                      "--key",
                      "docker/nginx/test.key",
                      "--host",
                      host,
                      "--port",
                      port,
                      "--extra-files",
                      "invenio.cfg",
                  )
              elif runner == "granian":
                  command = pkg_man.run_command(
                      "granian",
                      "--interface",
                      "wsgi",
                      "invenio_app.wsgi_ui:application",
                      "--host",
                      host,
                      "--port",
                      str(port),
                      "--ssl-certificate",
                      "docker/nginx/test.crt",
                      "--ssl-keyfile",
                      "docker/nginx/test.key",
                  )
              else:
                  raise ValueError(
                      f"Unknown runner {runner!r}, expected 'flask' or 'granian'"
                  )

              proc = self._labeled_popen("web", command, env=run_env)
              self._handle_sigint("Web server", proc)
              click.secho(f"Instance running!\nVisit https://{host}:{port}", fg="green")
              return [proc]

          def run_worker(
              self, celery_log_file=None, celery_log_level="INFO", jobs_scheduler=True
          ):
              """Run Celery worker."""
              click.secho("Starting celery worker...", fg="green")

              pkg_man = self.cli_config.python_package_manager
              celery_command = pkg_man.run_command(
                  "celery",
                  "--app",
                  "invenio_app.celery",
                  "worker",
                  "--beat",
                  "--events",
                  "--loglevel",
                  celery_log_level,
                  "--queues",
                  "celery,low",
              )

              if celery_log_file:
                  celery_command += [
                      "--logfile",
                      celery_log_file,
                  ]

              processes = []
              proc = self._labeled_popen("worker", celery_command)
              self._handle_sigint("Celery worker", proc)
              click.secho("Worker running!", fg="green")
              processes.append(proc)

              if jobs_scheduler:
                  processes.extend(self.run_jobs_scheduler(celery_log_file, celery_log_level))

              return processes

          def run_jobs_scheduler(self, celery_log_file=None, celery_log_level="INFO"):
              """Run Celery beat scheduler for jobs."""
              # Jobs scheduler is only available in RDM v13+
              version = rdm_version()
              if version is None:
                  click.secho(
                      "RDM version couldn't be determined. Not running jobs scheduler.",
                      fg="yellow",
                      err=True,
                  )
                  return []
              elif version[0] < 13:
                  return []

              click.secho("Starting jobs scheduler...", fg="green")

              pkg_man = self.cli_config.python_package_manager
              beat_command = pkg_man.run_command(
                  "celery",
                  "--app",
                  "invenio_app.celery",
                  "beat",
                  "--scheduler",
                  "invenio_jobs.services.scheduler:RunScheduler",
                  "--loglevel",
                  celery_log_level,
              )

              if celery_log_file:
                  beat_command += [
                      "--logfile",
                      celery_log_file,
                  ]

              proc = self._labeled_popen("beat", beat_command)
              self._handle_sigint("Jobs scheduler", proc)
              click.secho("Jobs scheduler running!", fg="green")
              return [proc]

          def run_all(
              self,
              host,
              port,
              debug=True,
              services=True,
              celery_log_file=None,
              celery_log_level="INFO",
              jobs_scheduler=True,
              runner="flask",
          ):
              """Run all services."""
              processes = [
                  *self.run_web(host, port, debug, runner=runner),
                  *self.run_worker(
                      celery_log_file, celery_log_level, jobs_scheduler=jobs_scheduler
                  ),
              ]

              return processes
    path: /usr/local/share/invenio-cli-patch/local.py
    owner: 'root:root'
    permissions: '0664'
